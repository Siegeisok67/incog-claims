# The block used as a claim's "core". Right-clicking it (as owner/trusted) opens the claim
# menu GUI. Breaking it deletes the claim. Give it any material you like - it's just tagged
# internally with plugin data, it doesn't need to be special vanilla-wise.
claim-core-material: BEACON

# Available claim sizes (cube, centered on the core block), in blocks.
# Each size has a claim-block cost the player must have earned to unlock it.
claim-sizes:
  48: 0
  96: 500
  144: 1200
  192: 2500

# How often (minutes) online players passively earn claim blocks, and how many they earn
# per interval. Default below works out to 5 claim blocks per minute (5 min x 5/min = 25).
earn-interval-minutes: 5
earn-amount: 25

# Hard cap on how many claim blocks a player can bank (from passive earning or admin grants).
# Prevents unlimited stockpiling.
max-claim-blocks: 5000

# Cooldown (days) before a player may switch between PVP and Peaceful.
switch-cooldown-days: 3

# Cooldown (minutes) before a player can request another Claim Core with /iclaims core.
# Only applies to getting a NEW core item - it does not affect an already-placed claim.
core-cooldown-minutes: 30

# Max obsidian blocks allowed inside a single claim (stops players obsidian-boxing their
# claim to make it unraidable). 0 = no limit.
max-obsidian-per-claim: 120

# Max bedrock blocks allowed inside a single claim. Bedrock isn't normally survival-
# obtainable, but if your server grants it some other way, this stops it being used to
# wall off a claim completely. Default 0 = bedrock can't be placed in a claim at all.
max-bedrock-per-claim: 0

# Cost to buy an additional claim beyond your first free one, via /iclaims buy.
# The new claim always starts at the smallest size - it does NOT inherit any expansion
# size from your other claim(s).
extra-claim-cost-blocks: 500
extra-claim-cost-end-crystals: 5

# If true, TNT/explosions are allowed to remove blocks inside PVP claims (raiding).
# Peaceful claims are ALWAYS fully protected from explosions regardless of this setting.
tnt-raid-enabled: true

# Only explosions triggered by a player who is themselves flagged PVP can raid PVP claims.
# If false, any TNT can raid a PVP claim regardless of who lit it.
require-pvp-attacker-to-raid: true

# OPs / incogclaims.admin holders always bypass claim protection.
op-bypass: true

# Rare loot-table chance (0.0 - 1.0) for the Claim Breaker pickaxe to appear in generated
# structure loot (dungeons, ruins, end cities, etc). It is intentionally NOT obtainable
# from villager trades - a safety-net cancel is also in place for that.
claimbreaker-loot-chance: 0.0015

# If true, the Claim Breaker pickaxe can also be crafted directly:
#   [Netherite Ingot]   [Netherite Ingot]   [Netherite Ingot]
#   [Diamond]           [Netherite Pickaxe] [Diamond]
#   [Copper Ingot]      [Totem of Undying]  [Copper Ingot]
claimbreaker-craftable: true

messages:
  prefix: "&8[&5Incog-Claims&8] &r"
  pvp-warning: "&c&lWARNING: &7You chose &c&lPVP&7. Other PVP players can raid your claim by blowing up its blocks with TNT. Choose wisely!"
  peaceful-info: "&a&lPeaceful &7chosen. Your claim can never be broken into or raided."
